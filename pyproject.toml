[project]
name = "pyslickdeals"
version = "2.0.0"
description = "Browse Slickdeals from the command line"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
slickdeals = "slickdeals.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/slickdeals"]
